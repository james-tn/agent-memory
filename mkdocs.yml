site_name: Agent Memory
site_description: User guide and deployment documentation for Agent Memory
repo_name: james-tn/agent-memory
repo_url: https://github.com/james-tn/agent-memory
exclude_docs: |
  old/
not_in_nav: |
  CODE_REVIEW_RECOMMENDATIONS.md
  DATABASE_ABSTRACTION_REFACTOR_PLAN.md
  ENTRA_ID_AUTH_SETUP.md
  FEATURE_ENHANCEMENT_RECOMMENDATIONS.md
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: cyan
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
  - Usage:
      - Direct Library Usage: usage/direct-library.md
      - Agent Framework Integration: usage/agent-framework.md
      - Server Mode: usage/server-mode.md
      - Demos: usage/demos.md
  - Backends:
      - Backend Selection: backends/index.md
      - SQLite: backends/sqlite.md
      - Cosmos DB: backends/cosmosdb.md
      - Azure AI Search: backends/azure-ai-search.md
      - PostgreSQL: backends/postgresql.md
  - Deployment:
      - Azure Deployment: deployment/azure.md
      - Entra ID Auth: deployment/entra-auth.md
      - Live Testing: deployment/live-testing.md
  - Reference:
      - Environment Variables: reference/environment-variables.md
      - HTTP API: reference/http-api.md
