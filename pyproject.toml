[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory"
version = "0.1.0"
description = "Pluggable agent memory with SQLite, Cosmos DB, Azure AI Search, and PostgreSQL backends"
requires-python = ">=3.12"
dependencies = [
    "agent-framework==1.0.0rc4",
    "asyncpg>=0.30.0",
    "openai>=2.5.0",
    "python-dotenv>=1.1.1",
    "azure-cosmos==4.14.0",
    "azure-identity>=1.19.0",
    "azure-search-documents>=11.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlite-vec>=0.1.6",
    "streamlit>=1.54.0",
    "plotly>=6.5.2",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
]

[tool.setuptools.packages.find]
include = ["memory*", "agent*", "application*", "demos*", "cosmos_db_search*"]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: runs live Azure-backed integration tests",
]
